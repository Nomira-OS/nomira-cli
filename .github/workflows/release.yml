# Started by hand from the Actions tab.
name: release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [beta, final]
        default: beta
      dry-run:
        description: Only show version and changelog
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    uses: Nomira-OS/ci/.github/workflows/checks.yml@9e5c8d3fe6f8c565dcee900f81fc05ac50b3b873 # main
  go:
    uses: Nomira-OS/ci/.github/workflows/go.yml@9e5c8d3fe6f8c565dcee900f81fc05ac50b3b873 # main
    with:
      trivy: true
  release:
    needs: [checks, go]
    permissions:
      contents: write
    uses: Nomira-OS/ci/.github/workflows/release.yml@9e5c8d3fe6f8c565dcee900f81fc05ac50b3b873 # main
    with:
      channel: ${{ inputs.channel }}
      dry-run: ${{ inputs.dry-run }}
