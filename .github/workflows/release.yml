# Started by hand from the Actions tab.
name: release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [beta, final]
        default: beta
      dry-run:
        description: Only show version and changelog
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    uses: Nomira-OS/ci/.github/workflows/checks.yml@5268ded05c8c4e37879d3140a2afed0dc2f7b9b1 # main
  go:
    uses: Nomira-OS/ci/.github/workflows/go.yml@5268ded05c8c4e37879d3140a2afed0dc2f7b9b1 # main
    with:
      trivy: true
  release:
    needs: [checks, go]
    permissions:
      contents: write
    uses: Nomira-OS/ci/.github/workflows/release.yml@5268ded05c8c4e37879d3140a2afed0dc2f7b9b1 # main
    with:
      channel: ${{ inputs.channel }}
      dry-run: ${{ inputs.dry-run }}
